services:
  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_USER: teach
      POSTGRES_PASSWORD: teach
      POSTGRES_DB: teach
    ports:
      - '5432:5432'
    volumes:
      - teach-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U teach -d teach']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  teach-postgres-data:
