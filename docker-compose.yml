services:
  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teach}
      POSTGRES_DB: ${POSTGRES_DB:-teach}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - teach-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U $${POSTGRES_USER:-teach} -d $${POSTGRES_DB:-teach}',
        ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  teach-postgres-data:
